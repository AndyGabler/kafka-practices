<!--
NOTE: This form could be better. It could validate the input, or the controller could.

It intentionally does not so there's an easy way to see the Kafka Producer rejecting messages that do not fit the
schema.
 -->
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layouts/layout">
<head>
    <title>Schema Info</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<label th:text="${userMessage}"></label>
<br/>
<form method="POST" action="#" th:action="@{/schemaInfo}">
    <table>
        <tr>
            <td><label path="schemaContent">Schema Content</label></td>
            <td><textarea th:text="${jsonSchemaText}" rows="50" cols="50" readonly /></td>
        </tr>
        <tr>
            <td><input type="submit" value="Submit"/></td>
        </tr>
    </table>
</form>
</body>
</html>
